<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Day 1 - Voice Memo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .voice-memo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: white;
        }
        .voice-memo h2 {
            margin: 0 0 15px 0;
            font-size: 24px;
        }
        .voice-memo p {
            margin: 0 0 20px 0;
            font-size: 16px;
        }
        .audio-player {
            background: rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 15px 30px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }
        .play-btn {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #764ba2;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="voice-memo">
        <h2>🎧 A Personal Message From Me</h2>
        <p>Take 2 minutes. Listen. Let me give you permission personally.</p>
        <div class="audio-player">
            <div class="play-btn">▶</div>
            <div>
                <div style="font-weight: bold;">Play Voice Memo</div>
                <div style="font-size: 14px; opacity: 0.8;">2:00</div>
            </div>
        </div>
    </div>
</body>
</html>
