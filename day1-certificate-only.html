<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Day 1 - Certificate</title>
    <style>
        body {
            font-family: Georgia, serif;
            background: #f5f0e8;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .certificate {
            background: linear-gradient(135deg, #faf8f5 0%, #f5f0e8 100%);
            border: 3px solid #c9b037;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
        }
        .certificate h2 {
            color: #c9b037;
            font-size: 32px;
            margin: 0 0 20px 0;
        }
        .certificate h3 {
            color: #2d2a26;
            font-size: 20px;
            margin: 0 0 30px 0;
        }
        .permissions {
            text-align: left;
            max-width: 400px;
            margin: 0 auto 30px;
            list-style: none;
            padding: 0;
        }
        .permissions li {
            color: #5a5650;
            padding: 12px 0;
            padding-left: 30px;
            position: relative;
            font-size: 16px;
        }
        .permissions li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #5a9a8a;
            font-weight: bold;
            font-size: 20px;
        }
        .download-btn {
            display: inline-block;
            background: #e07a3d;
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <h2>🏆 Certificate of Permission</h2>
        <h3>This certifies that <em>[Your Name]</em> is officially permitted to:</h3>
        
        <ul class="permissions">
            <li>Do absolutely nothing today</li>
            <li>Cancel plans without explanation</li>
            <li>Stay home on a sunny day</li>
            <li>Say "I'm good" to invitations</li>
            <li>Exist without optimizing</li>
        </ul>
        
        <a href="#" class="download-btn">📥 Download Certificate (PDF)</a>
    </div>
</body>
</html>
